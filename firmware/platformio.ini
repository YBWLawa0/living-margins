[platformio]
default_envs = waveshare_43

[env:waveshare_43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.1.2
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.0.1
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.0
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.4.2
